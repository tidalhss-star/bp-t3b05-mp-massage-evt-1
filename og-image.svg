<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="236" cy="641" r="62" fill="#9d174d" opacity="0.20"/>
    <circle cx="507" cy="573" r="26" fill="#9d174d" opacity="0.20"/>
    <circle cx="237" cy="573" r="97" fill="#9d174d" opacity="0.10"/>
    <circle cx="1155" cy="634" r="44" fill="#9d174d" opacity="0.18"/>
    <circle cx="478" cy="94" r="88" fill="#9d174d" opacity="0.12"/>
    <circle cx="6" cy="346" r="27" fill="#9d174d" opacity="0.13"/>
    <rect x="615" y="600" width="59" height="95" rx="8" fill="#be185d" opacity="0.08" transform="rotate(5, 1147, 185)"/>
    <rect x="38" y="618" width="71" height="84" rx="8" fill="#be185d" opacity="0.13" transform="rotate(33, 1221, 686)"/>
    <rect x="-76" y="-26" width="54" height="89" rx="8" fill="#be185d" opacity="0.06" transform="rotate(42, 644, 266)"/>
    <rect x="923" y="193" width="88" height="69" rx="8" fill="#be185d" opacity="0.14" transform="rotate(30, 41, 520)"/>
    <rect x="-85" y="47" width="34" height="96" rx="8" fill="#be185d" opacity="0.07" transform="rotate(40, 744, 127)"/>
    <rect x="41" y="350" width="43" height="82" rx="8" fill="#be185d" opacity="0.08" transform="rotate(41, 432, 428)"/>
    <rect x="885" y="645" width="59" height="78" rx="8" fill="#be185d" opacity="0.07" transform="rotate(0, 1056, 323)"/>
    <rect x="118" y="695" width="42" height="90" rx="8" fill="#be185d" opacity="0.06" transform="rotate(34, 127, 104)"/>
    <polygon points="686,132 723,206 649,206" fill="#9d174d" opacity="0.07"/>
    <polygon points="-10,146 41,248 -61,248" fill="#9d174d" opacity="0.11"/>
    <polygon points="313,79 388,229 238,229" fill="#9d174d" opacity="0.08"/>
    <polygon points="1199,483 1234,553 1164,553" fill="#9d174d" opacity="0.08"/>

  <!-- Wave at bottom -->
  <path d="M0,566 C360,598 840,534 1200,566 L1200,630 L0,630Z" fill="#9d174d" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 마사지 이벤트
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 마사지
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#f472b6" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 마포 마사지 이벤트 — 마사지
  </text>
</svg>